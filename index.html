<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos e Interações CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Aprendendo interações com CSS </h1>

    
    <h3> Botão que muda de cor:</h3>
    <button class="botao-cor">Passe o mouse aqui (Azul para Verde)</button>

    
    <h3>Desafio: Botão que muda a espessura da borda:</h3>
    <button class="botao-borda">Passe o mouse aqui 

    </button>

    
    <h3> Link com sublinhado e nova cor:</h3>
    <a href="https://www.google.com" target="_blank" class="link-interativo">Clique aqui para visitar o site do google</a><br>

    <a href="https://www.wikipedia.org">Cliquepara acessar wikipedia

    </a>

    
    <h3> Cartão interativo:</h3>
    <div class="cartao">
        <h2>Desenvolvimento Web</h2>
        <p>Aprenda a criar páginas para a internet.</p>
        <input class="input" type="text" placeholder="Digite algo...">
        <form>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="name" placeholder="name">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="seu@email.com">
            <button type="submit">Enviar</button>
        </form> 
    </div>

    <div class="container-botoes">
        <button class="botao-salvar">Salvar</button>
        <button class="botao-cancelar">Cancelar</button>
        <button class="botao-enviar">Enviar</button>
    </div>
</body>
</html>
